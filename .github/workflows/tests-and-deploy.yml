# Тесты при каждой отправке; сайт публикуется, только если все тесты прошли.
name: Тесты и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Сервер GitHub — Ubuntu 26.04 (Node 24, Chrome, MySQL 8.4) явно: с 19.10.2026 ubuntu-latest и так переходит на неё,
# а с явной меткой обновление образа не застанет выкладку врасплох. Действия — версии на Node 24.
permissions:
  contents: read
  pages: write
  id-token: write

# не публиковать две версии одновременно; начатую публикацию не прерывать
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # вся история: тест обновления базы берёт старую версию сервера из git
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # самая старая версия, которую должен поддерживать сервер
          extensions: pdo_sqlite, pdo_mysql, mbstring
          coverage: none
      - name: Сравнение речи («Говори»)
        run: node tests/speech.mjs
      - name: Объединение прогресса с разных устройств
        run: node tests/merge.mjs
      - name: Разметка по карте программы
        run: node tests/curriculum.mjs
      - name: Типы ошибок, мастерство, квесты и достижения
        run: node tests/mastery.mjs
      - name: Пакеты локаций (формат, озвучка подключённых, packs.js)
        run: node tests/packs.mjs
      - name: Сервер учителя (API) на SQLite
        run: node tests/api.mjs
      - name: Сервер учителя (API) на MySQL 8.4
        run: |
          sudo systemctl start mysql
          mysql --version
          EQ_TEST_MYSQL=1 node tests/api.mjs
      - name: Сквозной тест в Chrome
        # второй запуск — только чтобы случайная задержка на сервере не блокировала публикацию;
        # результат первого запуска остаётся в журнале
        run: node tests/smoke.mjs || (echo "Повторный запуск…" && node tests/smoke.mjs)

  deploy:
    name: Публикация на GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Собрать сайт (без тестов, инструментов и кода сервера)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'tools' --exclude 'packs' --exclude 'docs' --exclude 'server' --exclude '_site' --exclude 'CLAUDE.md' --exclude 'README.md' --exclude 'DESIGN.md' ./ _site/
          node tools/stamp.mjs _site   # версия в адресах скриптов и стилей
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

  # Сайт и код сервера — на хостинг (Спринтхост, SFTP): https://quest.logiqa.ru/
  # Загружаются только изменённые файлы (tools/deploy-hosting.mjs); config.php на сервере не трогается.
  # Нужны: секрет SPRINTHOST_PASSWORD или SPRINTHOST_SSH_KEY и переменные репозитория
  # SPRINTHOST_HOST, SPRINTHOST_USER, SPRINTHOST_KNOWN_HOSTS (см. server/README.md). Пока их нет — шаг пропускается.
  deploy-hosting:
    name: Публикация на quest.logiqa.ru
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SPRINTHOST_HOST != ''
    runs-on: ubuntu-26.04
    concurrency:
      group: hosting
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Установить lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      # Вход по ключу (секрет SPRINTHOST_SSH_KEY) или по паролю (секрет SPRINTHOST_PASSWORD).
      # Отпечаток сервера (переменная SPRINTHOST_KNOWN_HOSTS) обязателен — без него не подключаемся.
      - name: Доступ к хостингу
        env:
          KEY: ${{ secrets.SPRINTHOST_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SPRINTHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            SSH="$SSH -o BatchMode=yes -i $HOME/.ssh/deploy"
          fi
          echo "SSH_COMMAND=$SSH" >> "$GITHUB_ENV"
      - name: Выложить изменённые файлы (сервер, сайт, страницы последними)
        env:
          DEPLOY_URL: sftp://${{ vars.SPRINTHOST_USER }}@${{ vars.SPRINTHOST_HOST }}:${{ vars.SPRINTHOST_PORT || '22' }}
          SITE_PATH: ${{ vars.SPRINTHOST_PATH || 'domains/logiqa.ru/public_html/quest' }}
          SERVER_PATH: ${{ vars.SPRINTHOST_SERVER_PATH || 'domains/logiqa.ru/eq-server' }}
          STATE_PATH: ${{ vars.SPRINTHOST_STATE_PATH || 'domains/logiqa.ru/eq-deploy' }}
          LFTP_PASSWORD: ${{ secrets.SPRINTHOST_PASSWORD }}
        run: |
          node tools/stamp.mjs .   # версия в адресах скриптов и стилей (только в этой копии)
          node tools/deploy-hosting.mjs
      - name: Проверить сайт и сервер
        run: |
          curl -fsS https://quest.logiqa.ru/ | grep -q 'English Quest'
          curl -fsS https://quest.logiqa.ru/api/ | grep -q '"ok":true'
          [ "$(curl -fsS "https://quest.logiqa.ru/index.html?v=$GITHUB_SHA" | sha256sum)" = "$(sha256sum < index.html)" ] || { echo "На хостинге не та версия index.html"; exit 1; }
          echo "Сайт и сервер отвечают, версия совпадает"
          curl -fsSI https://quest.logiqa.ru/index.html | grep -qi '^cache-control: no-cache' || echo "::warning::index.html отдаётся без Cache-Control: no-cache — проверьте .htaccess в корне сайта"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://quest.logiqa.ru/)" = "301" ] || echo "::warning::http:// не перенаправляется на https://"
