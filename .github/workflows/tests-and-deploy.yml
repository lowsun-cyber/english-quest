# Тесты при каждой отправке; сайт публикуется, только если все тесты прошли.
name: Тесты и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# не публиковать две версии одновременно; начатую публикацию не прерывать
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # самая старая версия, которую должен поддерживать сервер
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Сравнение речи («Говори»)
        run: node tests/speech.mjs
      - name: Объединение прогресса с разных устройств
        run: node tests/merge.mjs
      - name: Сервер учителя (API)
        run: node tests/api.mjs
      - name: Сквозной тест в Chrome
        # второй запуск — только чтобы случайная задержка на сервере не блокировала публикацию;
        # результат первого запуска остаётся в журнале
        run: node tests/smoke.mjs || (echo "Повторный запуск…" && node tests/smoke.mjs)

  deploy:
    name: Публикация на GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт (без тестов, инструментов и кода сервера)
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'tools' --exclude 'server' --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
