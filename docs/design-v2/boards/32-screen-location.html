<sc-for list="{{quests}}" as="q" hint-placeholder-count="6">

</sc-for>

<div style="padding: 12px; background: #fffdf6; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 4px 4px 0 #1c2b1a; display: flex; flex-direction: column; gap: 6px;">

<div style="padding: 2px 10px; border: 2px solid #1c2b1a; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; {{sel.pill}}">{{sel.rarity}}</div>

<div style="font-size: 21px; font-weight: 800; line-height: 1.1;">{{sel.title}}</div>

<div style="flex: 1; font-size: 14px; font-weight: 700;">Приз: {{sel.prize}}</div>
<sc-if value="{{sel.isOpen}}" hint-placeholder-val="{{ true }}"><button type="button" style="min-width: 96px; min-height: 48px; background: #3fb650; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 0 4px 0 #1c2b1a; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 18px; font-weight: 800; color: #1c2b1a; cursor: pointer;">Играть</button></sc-if>

<nav style="display: flex; background: #fffdf6; border-top: 3px solid #1c2b1a;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const R = {
common: { label: 'ОБЫЧНЫЙ', fill: '#c9d3d8', pill: 'background: #c9d3d8;' },
revenge: { label: 'РЕВАНШ', fill: '#ff7bb0', pill: 'background: #ffb3d1;' },
rare: { label: 'РЕДКИЙ', fill: '#3a9fe0', pill: 'background: #8cc8f0;' },
epic: { label: 'ЭПИЧЕСКИЙ', fill: '#a870ff', pill: 'background: #c9b3ff;' },
legend: { label: 'ЛЕГЕНДАРНЫЙ · БОСС', fill: '#f5c02b', pill: 'background: #f5c02b;' }
};
const Q = [
{ id: 1, r: 'common', x: 44, y: 46, status: 'done', place: 'Полка с игрушками', title: 'Игрушки на полке', what: 'Узнай игрушки на слух и по картинке: doll, ball, teddy bear, car.', prize: '5 блоков', lock: '' },
{ id: 2, r: 'common', x: 156, y: 196, status: 'open', place: 'Мяч на полу', title: 'Чей это мяч?', what: 'Слово во фразе: It’s Ann’s ball. Whose car is it?', prize: '3 доски', lock: '' },
{ id: 3, r: 'revenge', x: 52, y: 172, status: 'open', place: 'Под кроватью', title: 'Слова-беглецы', what: 'Под кроватью прячутся 6 трудных слов из «Моих ошибок». Поймай их!', prize: 'карточка-трофей', lock: '' },
{ id: 4, r: 'rare', x: 270, y: 186, status: 'locked', place: 'Сундук', title: 'Тайник в сундуке', what: 'this, that, these, those: что лежит близко, а что далеко.', prize: 'кушетка для клиники', lock: 'Пройди «Чей это мяч?» на 80% — и сундук откроется (1 из 2).' },
{ id: 5, r: 'epic', x: 272, y: 66, status: 'locked', place: 'Книжный шкаф', title: 'Сказка о стойком солдатике', what: 'Прочитай сказку и ответь на вопросы.', prize: 'новая комната в клинике', lock: 'Сначала открой сундук.' },
{ id: 6, r: 'legend', x: 156, y: 84, status: 'locked', place: 'Дверь в башню игрушек', title: 'Хранитель игрушек', what: 'Босс комнаты: все слова и правила этой темы.', prize: 'золотой инструмент', lock: 'Пройди все квесты комнаты.' }
];
const selId = this.state.sel ?? 2;
const quests = Q.map((q) => {
const isSel = q.id === selId;
const bg = q.status === 'locked' ? '#e9ecea' : R[q.r].fill;
const ring = isSel ? 'box-shadow: 0 0 0 4px #fffdf6, 0 0 0 7px #1c2b1a;' : 'box-shadow: 3px 3px 0 #1c2b1a;';
const borderColor = q.status === 'locked' ? 'border-color: ' + R[q.r].fill + ';' : '';
return {
pos: 'left: ' + q.x + 'px; top: ' + q.y + 'px; background: ' + bg + '; ' + ring + ' ' + borderColor,
isLocked: q.status === 'locked',
showMark: q.status !== 'locked',
mark: q.status === 'done' ? '★' : String(q.id),
aria: q.place + ': ' + q.title + (q.status === 'locked' ? ', закрыто' : ''),
pick: () => this.setState({ sel: q.id })
};
});
const s = Q.find((q) => q.id === selId);
const sel = {
rarity: R[s.r].label, pill: R[s.r].pill, place: s.place, title: s.title, what: s.what, prize: s.prize, lock: s.lock,
isOpen: s.status === 'open', isDone: s.status === 'done', isLocked: s.status === 'locked'
};
return { quests, sel };
}
}
</script>
