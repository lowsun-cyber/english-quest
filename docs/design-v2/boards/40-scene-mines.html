<g stroke="#1c2b1a" stroke-width="3" stroke-linejoin="round">
<polygon points="196,500 212,470 226,500" fill="#5ce0e6"/>
<polygon points="220,500 240,462 256,500" fill="#a870ff"/>
<polygon points="248,500 262,478 276,500" fill="#9ff2f5"/>
<path d="M176 500 L296 500 L282 562 L190 562 Z" fill="#8a5a2b"/>
<rect x="172" y="496" width="128" height="12" rx="3" fill="#9fb0b8"/>
<circle cx="208" cy="566" r="13" fill="#3a4150"/>
<circle cx="266" cy="566" r="13" fill="#3a4150"/>

<g stroke="#1c2b1a" stroke-width="3" stroke-linejoin="round">
<rect x="36" y="452" width="82" height="52" rx="4" fill="#a8743f"/>

</g>
<circle cx="77" cy="446" r="22" fill="#ff6b3a" opacity="0.25"/>
</svg>
<img src="../heroes/max.svg" alt="Miner Max в пещере" style="position: absolute; left: 488px; top: 372px; width: 112px; height: 134px;">
<div style="position: absolute; left: 16px; top: 44px; padding: 8px 14px; background: #fffdf6; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 4px 4px 0 #000000;">
<div style="font-size: 12px; font-weight: 800; color: #4a3d8a; letter-spacing: 0.06em;">ШАХТЫ · СЕКРЕТНЫЙ РЕГИОН</div>
<div style="font-size: 24px; font-weight: 800; line-height: 1.05;">Кристальная пещера</div>
</div>
<sc-for list="{{quests}}" as="q" hint-placeholder-count="6">
<button type="button" onClick="{{q.pick}}" aria-label="{{q.aria}}" style="position: absolute; width: 50px; height: 50px; box-sizing: border-box; padding: 0; border-radius: 25px; border: 4px solid #1c2b1a; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 20px; font-weight: 800; color: #1c2b1a; cursor: pointer; display: flex; align-items: center; justify-content: center; {{q.pos}}">
<sc-if value="{{q.isLocked}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#1c2b1a" stroke-width="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#1c2b1a" stroke-width="3" stroke-linecap="round"/></svg></sc-if>
<sc-if value="{{q.showMark}}" hint-placeholder-val="{{ true }}">{{q.mark}}</sc-if>
</button>
</sc-for>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; align-items: flex-end; gap: 8px;">
<img src="../heroes/max-hint.svg" alt="Miner Max подсказывает" style="width: 70px; height: 74px; flex-shrink: 0;">
<div style="flex: 1; padding: 8px 12px; background: #fffdf6; border: 3px solid #1c2b1a; border-radius: 12px; box-shadow: 3px 3px 0 #000000; font-size: 15px; font-weight: 700; line-height: 1.25;">Здесь всё блестит! Нажми на метку — расскажу, что там.</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; color: #fffdf6;">
<div style="flex: 1; height: 14px; box-sizing: border-box; background: #1c2b1a; border: 2px solid #9ff2f5; border-radius: 4px; overflow: hidden;"><div style="width: 17%; height: 100%; background: #5ce0e6;"></div></div>
<div style="font-size: 15px; font-weight: 800; color: #9ff2f5;">1 из 6</div>
</div>
<div style="flex: 1; padding: 14px; background: #fffdf6; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 4px 4px 0 #000000; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
<div style="padding: 2px 10px; border: 2px solid #1c2b1a; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; {{sel.pill}}">{{sel.rarity}}</div>
<div style="font-size: 13px; font-weight: 700; color: #3a4a38;">{{sel.place}}</div>
</div>
<div style="font-size: 23px; font-weight: 800; line-height: 1.1;">{{sel.title}}</div>
<div style="font-size: 16px; font-weight: 600; color: #3a4a38; line-height: 1.3;">{{sel.what}}</div>
<div style="font-size: 15px; font-weight: 700;">Приз: {{sel.prize}}</div>
<div style="flex: 1;"></div>
<sc-if value="{{sel.isOpen}}" hint-placeholder-val="{{ true }}"><button type="button" style="min-height: 52px; background: #3fb650; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 0 4px 0 #1c2b1a; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 20px; font-weight: 800; color: #1c2b1a; cursor: pointer;">Играть</button></sc-if>
<sc-if value="{{sel.isDone}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 52px; background: #fffdf6; border: 3px solid #1c2b1a; border-radius: 6px; box-shadow: 0 4px 0 #1c2b1a; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 18px; font-weight: 800; color: #1c2b1a; cursor: pointer;">Пройдено ★★★ · ещё раз</button></sc-if>
<sc-if value="{{sel.isLocked}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #eef1ef; border-radius: 6px; font-size: 15px; font-weight: 700; color: #3a4a38;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="#3a4a38" stroke-width="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#3a4a38" stroke-width="2.5" stroke-linecap="round"/></svg>{{sel.lock}}</div></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; font-weight: 700; color: #dfe6e2;">
<div style="display: flex; align-items: center; gap: 5px;"><span style="width: 12px; height: 12px; border-radius: 6px; background: #a870ff; border: 2px solid #1c2b1a;"></span>эпический</div>
<div style="display: flex; align-items: center; gap: 5px;"><span style="width: 12px; height: 12px; border-radius: 6px; background: #f5c02b; border: 2px solid #1c2b1a;"></span>легендарный</div>
<div style="display: flex; align-items: center; gap: 5px;"><span style="width: 12px; height: 12px; border-radius: 6px; background: #ff6b3a; border: 2px solid #1c2b1a;"></span>особый</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const R = {
epic: { label: 'ЭПИЧЕСКИЙ', fill: '#a870ff', pill: 'background: #c9b3ff;' },
legend: { label: 'ЛЕГЕНДАРНЫЙ', fill: '#f5c02b', pill: 'background: #f5c02b;' },
boss: { label: 'ЛЕГЕНДАРНЫЙ · БОСС', fill: '#f5c02b', pill: 'background: #f5c02b;' },
special: { label: 'ОСОБЫЙ ★', fill: '#ff6b3a', pill: 'background: #ff9a7a;' }
};
const Q = [
{ id: 1, r: 'epic', x: 214, y: 438, status: 'done', place: 'Вагонетка с рудой', title: 'Груз слов', what: 'Разложи слова по вагонеткам: животные, еда, игрушки. Слова из всех пройденных тем.', prize: '10 кристаллов', lock: '' },
{ id: 2, r: 'epic', x: 262, y: 372, status: 'open', place: 'Фонарь на крепи', title: 'Свет в штольне', what: 'Прочитай при свете фонаря историю о шахтёре и ответь на вопросы.', prize: 'золотой фонарь для каски', lock: '' },
{ id: 3, r: 'legend', x: 742, y: 196, status: 'open', place: 'Кристальная жила', title: 'Кристаллы прошлого', what: 'Узнай прошедшее время: go — went, see — saw. Каждый верный ответ откалывает кристалл.', prize: 'бриллиантовый топор', lock: '' },
{ id: 4, r: 'epic', x: 690, y: 528, status: 'locked', place: 'Подземный ручей', title: 'Переправа', what: 'Собери предложения-доски, чтобы построить мост: There are two boats on the river.', prize: 'светящаяся аура', lock: 'Пройди «Свет в штольне», и Max достанет доски.' },
{ id: 5, r: 'special', x: 104, y: 400, status: 'open', place: 'Сундук старателя', title: 'Распутай this и that', what: 'Особый квест из посылки Dr. Harlow: близко или далеко? this, that, these, those.', prize: 'кристальная аура, только твоя', lock: '' },
{ id: 6, r: 'boss', x: 405, y: 176, status: 'locked', place: 'Ворота Глубокого забоя', title: 'Хранитель глубин', what: 'Босс Шахт: слова и правила из всех регионов, которые ты прошёл.', prize: 'секретная комната клиники', lock: 'Пройди все квесты пещеры, чтобы снять цепи.' }
];
const selId = this.state.sel ?? 3;
const quests = Q.map((q) => {
const isSel = q.id === selId;
const bg = q.status === 'locked' ? '#cfd6d2' : R[q.r].fill;
const ring = isSel ? 'box-shadow: 0 0 0 4px #fffdf6, 0 0 0 7px #1c2b1a;' : 'box-shadow: 3px 3px 0 #000000;';
const bc = q.status === 'locked' ? 'border-color: ' + R[q.r].fill + ';' : '';
return {
pos: 'left: ' + q.x + 'px; top: ' + q.y + 'px; background: ' + bg + '; ' + ring + ' ' + bc,
isLocked: q.status === 'locked',
showMark: q.status !== 'locked',
mark: q.status === 'done' ? '★' : String(q.id),
aria: q.place + ': ' + q.title + (q.status === 'locked' ? ', закрыто' : ''),
pick: () => this.setState({ sel: q.id })
};
});
const s = Q.find((q) => q.id === selId);
return {
quests,
sel: { rarity: R[s.r].label, pill: R[s.r].pill, place: s.place, title: s.title, what: s.what, prize: s.prize, lock: s.lock, isOpen: s.status === 'open', isDone: s.status === 'done', isLocked: s.status === 'locked' }
};
}
}
</script>
</body>
</html>
